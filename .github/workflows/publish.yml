# Publish @hanqunfeng/claude-trace to npm via OIDC Trusted Publishing.
# Prerequisites: configure a Trusted Publisher on npmjs.com for this package
# (owner: hanqunfeng, repo: claude-trace, workflow: publish.yml).
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm supports OIDC trusted publishing
        run: |
          node --version
          NPM_VERSION="$(npm --version)"
          echo "npm ${NPM_VERSION}"
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number);
            if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
              console.error('npm ' + process.argv[1] + ' is too old; need >= 11.5.1 for OIDC trusted publishing');
              process.exit(1);
            }
          " "${NPM_VERSION}"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "Publishing ${TAG} (package.json ${VERSION})"

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Smoke test CLI
        run: node dist/cli/cli.js --help

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish to npm (OIDC)
        run: npm publish --access public

      - name: Verify npm registry version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 10); do
            PUBLISHED=$(npm view @hanqunfeng/claude-trace version --prefer-online 2>/dev/null || true)
            if [ "${PUBLISHED}" = "${VERSION}" ]; then
              echo "Verified @hanqunfeng/claude-trace@${VERSION} on npm"
              exit 0
            fi
            echo "Waiting for registry sync (${attempt}/10): npm=${PUBLISHED:-<none>} local=${VERSION}"
            sleep 3
          done
          echo "::error::Registry version mismatch after publish"
          exit 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, skipping"
            exit 0
          fi
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --title "${TAG}" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Install
          ```bash
          npm install -g @hanqunfeng/claude-trace
          ```
          EOF
          )"
